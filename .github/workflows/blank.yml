name: "Compilar iOS IPA"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-13

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      - name: Configurar Godot Engine (.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          include-mono: true

      - name: Descargar e instalar Plantillas de Exportación de Godot
        run: |
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$TEMPLATE_DIR"
          
          # Descarga las plantillas oficial/mono correspondientes a tu versión
          curl -LO https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_export_templates.tpz
          
          # Extrae los contenidos en el directorio de plantillas de Godot
          unzip Godot_v4.7.2-stable_mono_export_templates.tpz -d temp_templates
          mv temp_templates/templates/* "$TEMPLATE_DIR/"
          rm -rf temp_templates Godot_v4.7.2-stable_mono_export_templates.tpz

      - name: Exportar Proyecto Xcode desde Godot
        run: |
          mkdir -p build/ios
          godot --headless --export-release "futbol_manu" build/ios/JuremosConGloriaMorir.xcodeproj

      - name: Compilar archivo IPA sin firmar con Xcode
        run: |
          cd build/ios
          xcodebuild -project JuremosConGloriaMorir.xcodeproj \
                     -scheme JuremosConGloriaMorir \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -r JuremosConGloriaMorir.ipa Payload

      - name: Subir ejecutable IPA como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Juego-iOS-IPA
          path: build/ios/JuremosConGloriaMorir.ipa
